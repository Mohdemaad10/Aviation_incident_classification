name: first worflow

on:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: copy repo
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.10

      - name: dependencies
        run: pip install -r requirements.txt

      - name: connect db
        run: python build_connection.py

      - name: execute tests
        run: pytest
        env: 
          API_KEY: ${{ secrets.API_KEY }}

      - name: build docker image
        run: docker build -t aviation-api-onnx .

